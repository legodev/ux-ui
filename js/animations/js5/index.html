<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript Animations 5</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header__container">
      <nav class="header__nav">
        <ul class="header__container-links">
          <li><a class="header__links" href="/index.html">Home</a></li>
          <li>
            <a class="header__links" href="/html/html1/index.html">HTML</a>
          </li>
          <li><a class="header__links" href="/css/index.html">CSS</a></li>
          <li><a class="header__links" href="/js/index.html">JavaScript</a></li>
        </ul>
      </nav>
    </header>
    <main class="main__container">
      <section class="section__container">
        <h1>Menú desplegable con animación de altura</h1>

        <section class="menu-container">
          <button id="menu-header">Menú</button>
          <div id="menu-content" class="menu-content">
            <a href="#">Opción 1</a>
            <a href="#">Opción 2</a>
            <a href="#">Opción 3</a>
          </div>
        </section>
      </section>
    </main>
    <footer class="footer__container">
      <p class="footer__year" id="year"></p>
    </footer>

    <script src="/script.js"></script>

    <script>
      const menuHeader = document.getElementById('menu-header')
      const menuContent = document.getElementById('menu-content')

      menuHeader.addEventListener('click', () => {
        menuContent.classList.toggle('open')

        if (menuContent.classList.contains('open')) {
          menuContent.style.height = menuContent.scrollHeight + 'px'
        } else {
          menuContent.style.height = '0'
        }
      })
    </script>
  </body>
</html>
