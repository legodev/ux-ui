<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Arrays 7</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header__container">
      <nav class="header__nav">
        <ul class="header__container-links">
          <li><a class="header__links" href="/index.html">Home</a></li>
          <li>
            <a class="header__links" href="/html/html1/index.html">HTML</a>
          </li>
          <li><a class="header__links" href="/css/index.html">CSS</a></li>
          <li><a class="header__links" href="/js/index.html">JavaScript</a></li>
        </ul>
      </nav>
    </header>
    <main class="main__container">
      <section class="exercise__container">
        <h1 class="exercise__title">
          Ejercicio Arrays 7: Informe completo del array
        </h1>
        <section class="exercise__container-p">
          <p>
            Recorrer un array de 10 posiciones e informar: Mayor valor, menor
            valor, posición del mayor, posición del menor, suma de pares, suma
            de impares y suma total.
          </p>
        </section>
        <section>
          <p>Array: [15, 8, 23, 42, 7, 99, 14, 33, 50, 61]</p>
        </section>
        <section class="exercise__container-txt">
          <textarea readonly name="" id="txt">Haz click para...</textarea>
        </section>
        <button onclick="showNumbers()" class="btn">Informe completo</button>
      </section>
    </main>
    <footer class="footer__container">
      <p class="footer__year" id="year"></p>
    </footer>

    <script src="/script.js"></script>

    <script>
      function showNumbers() {
        let txt = document.getElementById('txt')
        let array = [15, 8, 23, 42, 7, 99, 14, 33, 50, 61]
        let maxValue = array[0]
        let minValue = array[0]
        let txtMax = ''
        let txtMin = ''
        let evenAddition = 0
        let oddAddition = 0
        let generalAddition = 0
        let i = 0

        for (i; i < array.length; i++) {
          if (maxValue < array[i]) {
            maxValue = array[i]
            txtMax = 'Posición del mayor: ' + i
          } else if (minValue > array[i]) {
            minValue = array[i]
            txtMin = 'Posición del menor: ' + i
          } else {
            console.log('Error al calcular valores máximos y mínimos')
          }

          if (array[i] % 2 === 0) {
            evenAddition += array[i]
          } else if (array[i] % 2 !== 0) {
            oddAddition += array[i]
          } else {
            console.log('Error al calcular pares e impares')
          }

          generalAddition += array[i]
        }

        txt.innerHTML = 'El mayor valor es: ' + maxValue + '\n'
        txt.innerHTML += 'El menor valor es: ' + minValue + '\n'
        txt.innerHTML += txtMax + '\n'
        txt.innerHTML += txtMin + '\n'
        txt.innerHTML += 'La suma de los pares es: ' + evenAddition + '\n'
        txt.innerHTML += 'La suma de los impares es: ' + oddAddition + '\n'
        txt.innerHTML += 'La suma total es: ' + generalAddition + '\n'
      }
    </script>
  </body>
</html>
