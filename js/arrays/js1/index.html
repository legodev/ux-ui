<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Arrays 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header__container">
      <nav class="header__nav">
        <ul class="header__container-links">
          <li><a class="header__links" href="/index.html">Home</a></li>
          <li>
            <a class="header__links" href="/html/html1/index.html">HTML</a>
          </li>
          <li><a class="header__links" href="/css/index.html">CSS</a></li>
          <li><a class="header__links" href="/js/index.html">JavaScript</a></li>
        </ul>
      </nav>
    </header>
    <main class="main__container">
      <section class="exercise__container">
        <h1 class="exercise__title">
          Ejercicio Arrays 1: Recorrer con For y While
        </h1>
        <section class="exercise__container-p">
          <p>
            Recorrer el array usando dos bucles distintos <small>for</small> y
            <small>while</small>.
          </p>
        </section>
        <section>
          <p>Array: [15, 8, 23, 42, 7, 99, 14, 33, 50, 61]</p>
        </section>
        <section class="exercise__container-txt">
          <textarea readonly name="" id="txt">
Haz click para recorrer el array.</textarea
          >
        </section>
        <button onclick="showNumbers()" class="btn">¡Recorrer!</button>
      </section>
    </main>
    <footer class="footer__container">
      <p class="footer__year" id="year"></p>
    </footer>

    <script src="/script.js"></script>

    <script>
      function showNumbers() {
        let txt = document.getElementById('txt')
        let array = [15, 8, 23, 42, 7, 99, 14, 33, 50, 61]
        let txtFor = 'RECORRIDO CON FOR: ' + '\n'
        let txtWhile = 'RECORRIDO CON WHILE: ' + '\n'
        let i = 0
        let j = 0

        for (i; i < array.length; i++) {
          txtFor += array[i] + '\n'
        }

        while (j < array.length) {
          txtWhile += array[j] + '\n'
          j++
        }

        txt.innerHTML = txtFor + '\n'
        txt.innerHTML += '-----------------------------' + '\n'
        txt.innerHTML += '\n' + txtWhile + '\n'
      }
    </script>
  </body>
</html>
