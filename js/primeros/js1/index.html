<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Ejercicio 1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header__container">
      <nav class="header__nav">
        <ul class="header__container-links">
          <li><a class="header__links" href="/index.html">Home</a></li>
          <li>
            <a class="header__links" href="/html/html1/index.html">HTML</a>
          </li>
          <li><a class="header__links" href="/css/index.html">CSS</a></li>
          <li><a class="header__links" href="/js/index.html">JavaScript</a></li>
        </ul>
      </nav>
    </header>
    <main class="main__container">
      <section class="exercise__container">
        <h1 class="exercise__title">Ejercicio 01: ¿Es igual a 100?</h1>
        <section class="exercise__container-p">
          <h3 class="exercise__subtitle">Instrucciones</h3>
          <p>
            En este ejercicio, vamos a comprobar si una variable llamada
            <span>valor</span> es exactamente igual a 100.
          </p>
          <p>
            Si lo es, se mostrará un mensaje de felicitación ¡Vamos a verlo en
            acción!
          </p>
        </section>
        <section class="exercise__result-container">
          <p id="result">Por favor presione el botón.</p>
        </section>
        <button id="btn" onclick="isEqual()">¡Ejecutar Ejercicio!</button>
      </section>
    </main>
    <footer class="footer__container">
      <p class="footer__year" id="year"></p>
    </footer>

    <script src="/script.js"></script>

    <script>
      console.log('Hola Mundo')
      function isEqual() {
        let valor = 100
        let paragraph = document.getElementById('result')
        let correctText = 'Correcto! El valor es exactamente igual a 100'
        let incorrectText = 'Incorrecto! El valor no es exactamente igual a 100'

        if (valor === 100) {
          paragraph.innerText = correctText
        } else {
          paragraph.innerText = incorrectText
        }
      }
    </script>
  </body>
</html>
